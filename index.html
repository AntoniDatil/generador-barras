<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Códigos</title>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        body {
            /* Usa la fuente oficial de Apple */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f2f2f7;
            /* Color de fondo típico de iOS */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            outline: none;
        }

        input:focus {
            border-color: #007aff;
        }

        /* Azul de Apple al seleccionar */
        .barcode-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 300px;
            display: flex;
            justify-content: center;
            min-height: 120px;
            box-sizing: border-box;
        }

        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <h1>Generador de Códigos</h1>

    <input type="text" id="inputNumeros" placeholder="Introduce números..." inputmode="numeric" pattern="[0-9]*">

    <div class="barcode-container">
        <svg id="codigoBarras"></svg>
    </div>

    <script>
        const input = document.getElementById('inputNumeros');
        const svgElement = document.getElementById('codigoBarras');

        // Esta función se ejecuta cada vez que escribes un número
        input.addEventListener('input', function () {
            const texto = input.value;
            if (texto.length > 0) {
                try {
                    JsBarcode("#codigoBarras", texto, {
                        format: "CODE128", // Formato estándar que acepta cualquier número
                        lineColor: "#000",
                        width: 2,
                        height: 80,
                        displayValue: true,
                        fontSize: 18
                    });
                } catch (e) {
                    console.error("Error al generar el código");
                }
            } else {
                svgElement.innerHTML = ''; // Borra el código si está vacío
            }
        });
    </script>
</body>

</html>
