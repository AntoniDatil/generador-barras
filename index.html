<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Generador</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        /* =========================================
           TU CSS ORIGINAL INTACTO
           ========================================= */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f2f2f7;
            display: flex; flex-direction: column; align-items: center;
            padding: 50px 20px; margin: 0;
            overflow-x: hidden;
        }
        h1 { font-size: 24px; color: #333; margin-bottom: 30px; text-align: center; }
        input {
            width: 100%; max-width: 300px; padding: 15px; font-size: 20px;
            border: 1px solid #ccc; border-radius: 10px;
            text-align: center; margin-bottom: 10px; outline: none;
        }
        input:focus { border-color: #007aff; }
        
        .mensaje {
            color: #ff3b30;
            font-size: 14px; 
            min-height: 20px; 
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .barcode-container {
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%; max-width: 300px; display: flex; justify-content: center; align-items: center;
            min-height: 120px; box-sizing: border-box;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .barcode-container.zoomed {
            transform: scale(1.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .hint {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .hint.visible {
            opacity: 1;
        }

        svg { max-width: 100%; height: auto; }

        /* =========================================
           NUEVO CSS AÑADIDO PARA CÁMARA Y GUARDADO
           ========================================= */
        body { padding-bottom: 100px; } /* Añadido para poder hacer scroll */
        .btn-scan { background-color: #007aff; color: white; border: none; padding: 15px 20px; border-radius: 10px; font-size: 18px; font-weight: 600; width: 100%; max-width: 300px; margin-bottom: 20px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,122,255,0.3); display: none; }
        .btn-scan:active { background-color: #005bb5; }
        #reader { width: 100%; max-width: 300px; border-radius: 10px; overflow: hidden; margin-bottom: 20px; display: none; }
        
        .btn-save { background-color: #34c759; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; font-weight: 600; width: 100%; max-width: 300px; margin-top: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(52,199,89,0.3); display: none; }
        .btn-save:active { background-color: #248a3d; }
        #inputDescripcion { display: none; font-size: 16px; text-align: left; }
        
        .seccion-guardados { width: 100%; max-width: 300px; margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px; }
        .seccion-guardados h2 { font-size: 18px; color: #333; margin-bottom: 15px; }
        .item-guardado { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .item-datos { display: flex; flex-direction: column; cursor: pointer; flex-grow: 1; }
        .item-nombre { font-weight: 600; font-size: 16px; color: #111; margin-bottom: 4px; }
        .item-numero { font-size: 14px; color: #007aff; font-family: monospace; }
        .btn-delete { background: none; border: none; color: #ff3b30; font-size: 20px; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Generador GS1-128</h1>
    
    <button id="btnScan" class="btn-scan">📷 Escanear Código</button>
    <div id="reader"></div>

    <input type="text" id="inputNumeros" placeholder="Introduce 10 números..." inputmode="numeric" pattern="[0-9]*" maxlength="10">
    
    <div id="mensajeError" class="mensaje"></div>
    
    <div class="barcode-container" id="contenedorBarras">
        <svg id="codigoBarras"></svg>
    </div>

    <div id="textoAyuda" class="hint">Toca el código para ampliarlo</div>

    <input type="text" id="inputDescripcion" placeholder="Nombre (ej: Palé Agua)..." maxlength="30">
    <button id="btnGuardar" class="btn-save">💾 Guardar Etiqueta</button>

    <div class="seccion-guardados" id="seccionGuardados" style="display: none;">
        <h2>Etiquetas Guardadas</h2>
        <div id="listaGuardados"></div>
    </div>

    <script>
        // ==========================================
        // TU CÓDIGO JS ORIGINAL INTACTO
        // ==========================================
        const miPin = "1234"; // Tu PIN de seguridad
        let intento = prompt("Introduce el PIN para usar la app:");
        
        if (intento !== miPin) {
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Acceso Denegado</h2>";
        } else {
            const input = document.getElementById('inputNumeros');
            const svgElement = document.getElementById('codigoBarras');
            const mensajeError = document.getElementById('mensajeError');
            const contenedor = document.getElementById('contenedorBarras');
            const textoAyuda = document.getElementById('textoAyuda');

            contenedor.addEventListener('click', function() {
                if (input.value.length === 10) {
                    this.classList.toggle('zoomed');
                }
            });

            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                const texto = this.value;

                if (texto.length < 10) {
                    contenedor.classList.remove('zoomed');
                }

                if (texto.length === 10) {
                    mensajeError.innerText = '';
                    textoAyuda.classList.add('visible');
                    try {
                        // AQUÍ ESTÁ LA MAGIA ORIGINAL:
                        JsBarcode("#codigoBarras", "\xCF" + texto, {
                            format: "CODE128", 
                            text: texto, 
                            lineColor: "#000",
                            width: 2,
                            height: 80,
                            displayValue: true,
                            fontSize: 18
                        });
                    } catch (e) {
                        console.error("Error al generar el código");
                    }
                } else {
                    svgElement.innerHTML = '';
                    textoAyuda.classList.remove('visible');
                    
                    if (texto.length > 0) {
                        const faltan = 10 - texto.length;
                        mensajeError.innerText = `Faltan ${faltan} números`;
                    } else {
                        mensajeError.innerText = ''; 
                    }
                }
            });

            // ==========================================
            // NUEVO CÓDIGO JS AÑADIDO (Cámara y Guardado)
            // ==========================================
            const btnScan = document.getElementById('btnScan');
            const readerDiv = document.getElementById('reader');
            const inputDescripcion = document.getElementById('inputDescripcion');
            const btnGuardar = document.getElementById('btnGuardar');
            const seccionGuardados = document.getElementById('seccionGuardados');
            const listaGuardados = document.getElementById('listaGuardados');

            // Mostramos el botón de escanear porque el PIN fue correcto
            btnScan.style.display = 'block';

            // Escuchamos el input para mostrar/ocultar los botones de guardar
            input.addEventListener('input', function() {
                if (input.value.length === 10) {
                    inputDescripcion.style.display = 'block';
                    btnGuardar.style.display = 'block';
                } else {
                    inputDescripcion.style.display = 'none';
                    btnGuardar.style.display = 'none';
                }
            });

            // 1. LÓGICA DE GUARDADO
            let etiquetasGuardadas = JSON.parse(localStorage.getItem('misEtiquetas')) || [];
            renderizarLista();

            btnGuardar.addEventListener('click', () => {
                const numero = input.value;
                let nombre = inputDescripcion.value.trim() || "Etiqueta sin nombre";
                
                if (etiquetasGuardadas.find(e => e.numero === numero)) {
                    alert("Este número ya está en tu lista de guardados.");
                    return;
                }

                etiquetasGuardadas.push({ numero, nombre });
                localStorage.setItem('misEtiquetas', JSON.stringify(etiquetasGuardadas));
                inputDescripcion.value = "";
                renderizarLista();
                
                btnGuardar.innerText = "¡Guardado! ✅";
                setTimeout(() => { btnGuardar.innerText = "💾 Guardar Etiqueta"; }, 2000);
            });

            function renderizarLista() {
                listaGuardados.innerHTML = "";
                if (etiquetasGuardadas.length === 0) {
                    seccionGuardados.style.display = "none";
                    return;
                }
                seccionGuardados.style.display = "block";
                etiquetasGuardadas.forEach((etiqueta, index) => {
                    const div = document.createElement('div');
                    div.className = "item-guardado";
                    div.innerHTML = `
                        <div class="item-datos" onclick="cargarEtiqueta('${etiqueta.numero}')">
                            <div class="item-nombre">${etiqueta.nombre}</div>
                            <div class="item-numero">${etiqueta.numero}</div>
                        </div>
                        <button class="btn-delete" onclick="borrarEtiqueta(${index})">🗑️</button>
                    `;
                    listaGuardados.appendChild(div);
                });
            }

            // Al cargar etiqueta, disparamos el evento para que se ejecute TU código de arriba
            window.cargarEtiqueta = function(numero) {
                input.value = numero;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                input.dispatchEvent(new Event('input'));
            };

            window.borrarEtiqueta = function(index) {
                if(confirm("¿Seguro que quieres borrar esta etiqueta?")) {
                    etiquetasGuardadas.splice(index, 1);
                    localStorage.setItem('misEtiquetas', JSON.stringify(etiquetasGuardadas));
                    renderizarLista();
                }
            };

            // 2. LÓGICA DEL ESCÁNER
            let html5QrCode;
            btnScan.addEventListener('click', () => {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = "none";
                        btnScan.innerText = "📷 Escanear Código";
                        btnScan.style.backgroundColor = "#007aff";
                    });
                } else {
                    readerDiv.style.display = "block";
                    btnScan.innerText = "Detener Cámara";
                    btnScan.style.backgroundColor = "#ff3b30";
                    
                    html5QrCode = new Html5Qrcode("reader");
                    html5QrCode.start(
                        { facingMode: "environment" }, 
                        { fps: 10, qrbox: { width: 250, height: 100 } },
                        (decodedText) => {
                            html5QrCode.stop().then(() => {
                                readerDiv.style.display = "none";
                                btnScan.innerText = "📷 Escanear Código";
                                btnScan.style.backgroundColor = "#007aff";
                                
                                let nums = decodedText.replace(/[^0-9]/g, '');
                                if(nums.length > 10) nums = nums.substring(0, 10);
                                
                                input.value = nums;
                                // Disparamos el evento para que TU código procese el dibujo
                                input.dispatchEvent(new Event('input')); 
                            });
                        },
                        () => {}
                    ).catch(() => {
                        alert("No se pudo acceder a la cámara. Asegúrate de darle permisos a Safari.");
                        readerDiv.style.display = "none";
                        btnScan.innerText = "📷 Escanear Código";
                        btnScan.style.backgroundColor = "#007aff";
                    });
                }
            });
        }
    </script>
</body>
</html>
