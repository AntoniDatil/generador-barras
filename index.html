<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Códigos</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f2f2f7;
            display: flex; flex-direction: column; align-items: center;
            padding: 50px 20px; margin: 0;
            overflow-x: hidden; /* Evita que la pantalla se mueva a los lados al hacer zoom */
        }
        h1 { font-size: 24px; color: #333; margin-bottom: 30px; text-align: center; }
        input {
            width: 100%; max-width: 300px; padding: 15px; font-size: 20px;
            border: 1px solid #ccc; border-radius: 10px;
            text-align: center; margin-bottom: 10px; outline: none;
        }
        input:focus { border-color: #007aff; }
        
        .mensaje {
            color: #ff3b30;
            font-size: 14px; 
            min-height: 20px; 
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        /* Contenedor del código de barras */
        .barcode-container {
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%; max-width: 300px; display: flex; justify-content: center; align-items: center;
            min-height: 120px; box-sizing: border-box;
            
            /* Animación suave para el zoom */
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        /* Clase que se activa al tocar el código para hacer el zoom */
        .barcode-container.zoomed {
            transform: scale(1.4); /* Aumenta el tamaño un 40% */
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); /* Sombra más grande para dar efecto 3D */
            z-index: 10;
        }

        /* Texto de ayuda para el zoom */
        .hint {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .hint.visible {
            opacity: 1;
        }

        svg { max-width: 100%; height: auto; }
    </style>
</head>
<body>

    <h1>Generador (10 dígitos)</h1>
    
    <input type="text" id="inputNumeros" placeholder="Introduce 10 números..." inputmode="numeric" pattern="[0-9]*" maxlength="10">
    
    <div id="mensajeError" class="mensaje"></div>
    
    <div class="barcode-container" id="contenedorBarras">
        <svg id="codigoBarras"></svg>
    </div>

    <div id="textoAyuda" class="hint">Toca el código para ampliarlo</div>

    <script>
        const miPin = "1234"; 
        let intento = prompt("Introduce el PIN para usar la app:");
        
        if (intento !== miPin) {
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Acceso Denegado</h2>";
        } else {
            const input = document.getElementById('inputNumeros');
            const svgElement = document.getElementById('codigoBarras');
            const mensajeError = document.getElementById('mensajeError');
            const contenedor = document.getElementById('contenedorBarras');
            const textoAyuda = document.getElementById('textoAyuda');

            // Lógica para hacer zoom al tocar el contenedor
            contenedor.addEventListener('click', function() {
                // Solo hace zoom si hay un código generado (si el texto tiene 10 números)
                if (input.value.length === 10) {
                    this.classList.toggle('zoomed');
                }
            });

            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                const texto = this.value;

                // Si borras un número mientras está el zoom activado, quitamos el zoom
                if (texto.length < 10) {
                    contenedor.classList.remove('zoomed');
                }

                if (texto.length === 10) {
                    mensajeError.innerText = '';
                    textoAyuda.classList.add('visible'); // Mostramos el texto "Toca para ampliar"
                    try {
                        JsBarcode("#codigoBarras", texto, {
                            format: "CODE128", 
                            lineColor: "#000",
                            width: 2,
                            height: 80,
                            displayValue: true,
                            fontSize: 18
                        });
                    } catch (e) {
                        console.error("Error al generar el código");
                    }
                } else {
                    svgElement.innerHTML = '';
                    textoAyuda.classList.remove('visible'); // Ocultamos el texto
                    
                    if (texto.length > 0) {
                        const faltan = 10 - texto.length;
                        mensajeError.innerText = `Faltan ${faltan} números`;
                    } else {
                        mensajeError.innerText = ''; 
                    }
                }
            });
        }
    </script>
</body>
</html>
